{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">
            <div class="bg-primary p-4 text-center" style="background: linear-gradient(135deg, var(--brand), var(--accent));">
                <div class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-circle shadow-sm mb-3" style="width: 64px; height: 64px; font-size: 28px;">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>
                <h1 class="h3 fw-bold text-white mb-0">Welcome</h1>
                <p class="text-white-50 mb-0">Sign in to continue to ResearchFlow</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small text-uppercase" style="letter-spacing: 0.5px;">Username or email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 ps-0 bg-light" placeholder="Enter your username or email" required autofocus>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small text-uppercase" style="letter-spacing: 0.5px;">Role</label>
                        <div class="d-flex gap-2">
                            <input type="radio" class="btn-check" name="role" id="roleStudent" value="student" autocomplete="off" checked>
                            <label class="btn btn-outline-secondary flex-fill text-center" for="roleStudent">Student</label>

                            <input type="radio" class="btn-check" name="role" id="roleSupervisor" value="supervisor" autocomplete="off">
                            <label class="btn btn-outline-secondary flex-fill text-center" for="roleSupervisor">Supervisor</label>

                            <input type="radio" class="btn-check" name="role" id="roleAdmin" value="admin" autocomplete="off">
                            <label class="btn btn-outline-secondary flex-fill text-center" for="roleAdmin">Admin</label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label class="form-label text-muted fw-bold small text-uppercase" style="letter-spacing: 0.5px;">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0 bg-light" placeholder="Enter your password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 mt-2 shadow-sm">
                        <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'signup' %}" class="fw-bold text-primary text-decoration-none">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
