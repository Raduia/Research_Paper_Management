{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">
            <div class="p-4 text-center" style="background: linear-gradient(135deg, var(--brand), var(--brand-dark));">
                <div class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-circle shadow-sm mb-3" style="width: 64px; height: 64px; font-size: 28px;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="h3 fw-bold text-white mb-0">Create an Account</h1>
                <p class="text-white-50 mb-0">Join ResearchFlow and manage your portfolio</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        <div class="col-sm-6 mb-3">
                            <label class="form-label text-muted fw-bold small text-uppercase">Username *</label>
                            <input type="text" name="username" class="form-control bg-light" required>
                        </div>
                        
                        <div class="col-sm-6 mb-3">
                            <label class="form-label text-muted fw-bold small text-uppercase">Email</label>
                            <input type="email" name="email" class="form-control bg-light">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small text-uppercase">Role *</label>
                        <div class="d-flex gap-3">
                            <div class="form-check flex-grow-1 border rounded p-3 bg-light custom-hover">
                                <input class="form-check-input ms-0" type="radio" name="role" id="roleStudent" value="student" checked>
                                <label class="form-check-label ms-2 d-block w-100" style="cursor: pointer;" for="roleStudent">
                                    <strong>Student</strong>
                                    <div class="small text-muted">Upload and track papers</div>
                                </label>
                            </div>
                            <div class="form-check flex-grow-1 border rounded p-3 bg-light custom-hover">
                                <input class="form-check-input ms-0" type="radio" name="role" id="roleSupervisor" value="supervisor">
                                <label class="form-check-label ms-2 d-block w-100" style="cursor: pointer;" for="roleSupervisor">
                                    <strong>Supervisor</strong>
                                    <div class="small text-muted">Review student papers</div>
                                </label>
                            </div>
                            <div class="form-check flex-grow-1 border rounded p-3 bg-light custom-hover">
                                <input class="form-check-input ms-0" type="radio" name="role" id="roleAdmin" value="admin">
                                <label class="form-check-label ms-2 d-block w-100" style="cursor: pointer;" for="roleAdmin">
                                    <strong>Admin</strong>
                                    <div class="small text-muted">Platform administrator</div>
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <label class="form-label text-muted fw-bold small text-uppercase">Password *</label>
                            <input type="password" name="password1" class="form-control bg-light" required minlength="8">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label text-muted fw-bold small text-uppercase">Confirm *</label>
                            <input type="password" name="password2" class="form-control bg-light" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-sm">
                        Create Account
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Already have an account? <a href="{% url 'login' %}" class="fw-bold text-primary text-decoration-none">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.custom-hover:hover { background-color: var(--surface-soft) !important; border-color: var(--brand) !important; }
</style>
{% endblock %}
